# ============================================================================
# game_vision — конфигурация
# ============================================================================

# game_detect: классификация объектов
# ID назначаются в find_object_2d при добавлении объектов (1, 2, 3, ...)
# Измените эти значения в соответствии с вашими объектами.
game_detect:
  ros__parameters:
    good_objects: [1, 2]       # ID "хороших" объектов
    normal_objects: [3, 4]     # ID "нормальных" объектов
    bad_objects: [5, 6]        # ID "плохих" объектов

# aruco_mapping: параметры карты
aruco_mapping:
  ros__parameters:
    cell_size_mm: 250.0        # Размер клетки/маркера (мм)
    rows: 7
    cols: 5
    # Ручной маппинг ArUco ID (4x4) -> позиция на карте [row, col]
    # Раскомментируйте и заполните если нужна фиксированная привязка:
    # aruco_cell_map:
    #   - {id: 0, row: 0, col: 1}
    #   - {id: 1, row: 0, col: 3}
    #   - {id: 2, row: 1, col: 0}
    #   ...

# game_node: параметры игры
game_node:
  ros__parameters:
    log_level: info
